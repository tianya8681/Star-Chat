<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聊天软件</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="sidebar">
            <div class="header">
                <h2>消息  >✨星聊Star Chat</h2>
                <a href="/logout" class="logout">退出登录</a>
            </div>
            <div class="user-info" data-user-id="{{ user.id }}">
                <label class="avatar-upload" for="avatarInput">
                    <div class="avatar" id="userAvatar">{{ user.nickname[0] }}</div>
                    <span class="avatar-edit-icon">📷</span>
                </label>
                <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                <div class="nickname-container">
                    <span class="nickname" id="currentNickname">{{ user.nickname }}</span>
                    <span class="edit-nickname" onclick="editNickname()">✏️</span>
                </div>
                <input type="text" id="nicknameInput" class="nickname-input" placeholder="输入新昵称" style="display: none;">
                <button id="saveNicknameBtn" style="display: none;" onclick="saveNickname()">保存</button>
                <button id="cancelNicknameBtn" style="display: none;" onclick="cancelNicknameEdit()">取消</button>
            </div>
            
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('friends')">好友</button>
                <button class="tab-btn" onclick="switchTab('requests')">好友请求</button>
                <button class="tab-btn" onclick="switchTab('search')">添加好友</button>
            </div>

            <div class="search-box" id="searchBox" style="display: none;">
                <input type="text" id="searchInput" placeholder="搜索用户...">
            </div>

            <div class="friend-requests" id="friendRequests" style="display: none;">
                <div class="empty-state" id="requestsEmpty">
                    <p>暂无好友请求</p>
                </div>
            </div>

            <div class="search-results" id="searchResults" style="display: none;">
                <div class="empty-state" id="searchEmpty">
                    <p>输入关键词搜索用户</p>
                </div>
            </div>

            <div class="user-list" id="userList">
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="contact-info">
                    <div class="avatar" id="contactAvatar"></div>
                    <div class="contact-details">
                        <span id="contactName">选择一个联系人开始聊天</span>
                        <span id="contactStatus" class="status"></span>
                    </div>
                </div>
                
            </div>

            <div class="messages" id="messages">
                <div class="empty-state">
                    <div class="empty-icon">💬</div>
                    <p>选择一个联系人开始聊天</p>
                </div>
            </div>

            <div class="input-area">
                <label class="file-upload-btn" for="fileInput">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </label>
                <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
                <button class="emoji-btn" id="emojiBtn" title="表情">😊</button>
                <input type="text" id="messageInput" placeholder="输入消息..." disabled>
                <button id="sendBtn" disabled>发送</button>
            </div>
            
            <div class="emoji-panel" id="emojiPanel" style="display: none;">
                <div class="emoji-tabs">
                    <button class="emoji-tab active" data-category="smile">😀</button>
                    <button class="emoji-tab" data-category="love">❤️</button>
                    <button class="emoji-tab" data-category="hand">👋</button>
                    <button class="emoji-tab" data-category="animal">🐱</button>
                    <button class="emoji-tab" data-category="food">🍔</button>
                    <button class="emoji-tab" data-category="activity">⚽</button>
                </div>
                <div class="emoji-list" id="emojiList"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
