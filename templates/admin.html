<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - Chat System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .admin-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 280px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 24px;
            color: white;
        }

        .sidebar h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar h1::before {
            content: '⚙️';
            font-size: 28px;
        }

        .admin-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: white;
            margin-bottom: 24px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 8px;
        }

        .nav-menu a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(4px);
        }

        .nav-menu a i {
            font-size: 18px;
        }

        .main-content {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .content-card {
            background: white;
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .card-header h2 {
            font-size: 24px;
            color: #1a1a2e;
        }

        .search-box {
            position: relative;
        }

        .search-box input {
            padding: 12px 40px 12px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            width: 280px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-box::after {
            content: '🔍';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 24px;
            border-radius: 16px;
            color: white;
            text-align: center;
        }

        .stat-card .number {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .stat-card .label {
            font-size: 14px;
            opacity: 0.9;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #666;
            font-size: 14px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
            margin-right: 8px;
        }

        .btn-approve {
            background: #28a745;
            color: white;
        }

        .btn-approve:hover {
            background: #218838;
        }

        .btn-disable {
            background: #dc3545;
            color: white;
        }

        .btn-disable:hover {
            background: #c82333;
        }

        .btn-edit {
            background: #17a2b8;
            color: white;
        }

        .btn-edit:hover {
            background: #138496;
        }

        .btn-delete {
            background: #6c757d;
            color: white;
        }

        .btn-delete:hover {
            background: #5a6268;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            border-radius: 20px;
            padding: 32px;
            width: 90%;
            max-width: 500px;
        }

        .modal h3 {
            font-size: 20px;
            margin-bottom: 24px;
            color: #1a1a2e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }

        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }

        .btn-cancel:hover {
            background: #e0e0e0;
        }

        .btn-save {
            background: #667eea;
            color: white;
        }

        .btn-save:hover {
            background: #5a6fd6;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        .page-btn {
            padding: 10px 16px;
            border: 1px solid #e8e8e8;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-btn:hover:not(.active) {
            background: #f8f9fa;
        }

        .page-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="sidebar">
            <h1>管理后台</h1>
            <div class="admin-badge">
                <span>👤</span>
                <span id="adminUsername">admin</span>
            </div>
            <ul class="nav-menu">
                <li><a href="#users" class="active" onclick="showSection('users')"><i>👥</i> 用户管理</a></li>
                <li><a href="#permissions" onclick="showSection('permissions')"><i>🔐</i> 权限管理</a></li>
                <li><a href="#messages" onclick="showSection('messages')"><i>💬</i> 消息管理</a></li>
                <li><a href="#settings" onclick="showSection('settings')"><i>⚙️</i> 系统设置</a></li>
                <li><a href="#profile" onclick="showSection('profile')"><i>👤</i> 修改密码</a></li>
                <li><a href="/admin/logout"><i>🚪</i> 退出登录</a></li>
            </ul>
        </div>

        <div class="main-content">
            <!-- 用户管理 -->
            <div id="users-section" class="content-card">
                <div class="card-header">
                    <h2>👥 用户管理</h2>
                    <div class="search-box">
                        <input type="text" id="userSearch" placeholder="搜索用户...">
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="number" id="totalUsers">0</div>
                        <div class="label">总用户数</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="activeUsers">0</div>
                        <div class="label">活跃用户</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="pendingUsers">0</div>
                        <div class="label">待审核</div>
                    </div>
                    <div class="stat-card">
                        <div class="number" id="disabledUsers">0</div>
                        <div class="label">已禁用</div>
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>头像</th>
                                <th>ID</th>
                                <th>用户名</th>
                                <th>昵称</th>
                                <th>状态</th>
                                <th>创建时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="userTableBody">
                            <tr>
                                <td colspan="6" class="empty-state">
                                    <div class="icon">🔄</div>
                                    <p>加载中...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 权限管理 -->
            <div id="permissions-section" class="content-card" style="display: none;">
                <div class="card-header">
                    <h2>🔐 权限管理</h2>
                </div>
                
                <div class="form-group">
                    <label>选择用户</label>
                    <select id="permissionUserSelect">
                        <option value="">请选择用户</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>聊天权限</label>
                    <select id="chatPermission">
                        <option value="enabled">启用</option>
                        <option value="disabled">禁用</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>文件上传权限</label>
                    <select id="uploadPermission">
                        <option value="enabled">启用</option>
                        <option value="disabled">禁用</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button class="action-btn btn-cancel" onclick="resetPermissionForm()">重置</button>
                    <button class="action-btn btn-save" onclick="savePermissions()">保存权限</button>
                </div>
            </div>

            <!-- 消息管理 -->
            <div id="messages-section" class="content-card" style="display: none;">
                <div class="card-header">
                    <h2>💬 消息管理</h2>
                    <div class="search-box">
                        <input type="text" id="messageSearch" placeholder="搜索消息内容...">
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>发送者</th>
                                <th>接收者</th>
                                <th>内容</th>
                                <th>类型</th>
                                <th>时间</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="messageTableBody">
                            <tr>
                                <td colspan="7" class="empty-state">
                                    <div class="icon">🔄</div>
                                    <p>加载中...</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 系统设置 -->
            <div id="settings-section" class="content-card" style="display: none;">
                <div class="card-header">
                    <h2>⚙️ 系统设置</h2>
                </div>

                <div class="form-group">
                    <label>新用户默认状态</label>
                    <select id="defaultUserStatus">
                        <option value="active">自动生效</option>
                        <option value="pending">需审核</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>最大文件上传大小 (MB)</label>
                    <input type="number" id="maxFileSize" value="50" min="1" max="500">
                </div>

                <div class="form-group">
                    <label>允许的图片格式</label>
                    <input type="text" id="allowedImageTypes" value="png,jpg,jpeg,gif,webp">
                </div>

                <div class="form-group">
                    <label>允许的视频格式</label>
                    <input type="text" id="allowedVideoTypes" value="mp4,webm,mov">
                </div>

                <div class="form-actions">
                    <button class="action-btn btn-cancel" onclick="resetSettingsForm()">重置</button>
                    <button class="action-btn btn-save" onclick="saveSettings()">保存设置</button>
                </div>
            </div>

            <!-- 修改密码 -->
            <div id="profile-section" class="content-card" style="display: none;">
                <div class="card-header">
                    <h2>👤 修改密码</h2>
                </div>

                <div class="form-group">
                    <label>当前密码</label>
                    <input type="password" id="currentPassword" placeholder="请输入当前密码">
                </div>

                <div class="form-group">
                    <label>新密码</label>
                    <input type="password" id="newPassword" placeholder="请输入新密码">
                </div>

                <div class="form-group">
                    <label>确认新密码</label>
                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                </div>

                <div id="passwordError" style="display: none; color: #dc3545; margin-bottom: 16px; padding: 12px; background: #fff3cd; border-radius: 8px;"></div>

                <div id="passwordSuccess" style="display: none; color: #28a745; margin-bottom: 16px; padding: 12px; background: #d4edda; border-radius: 8px;">密码修改成功！</div>

                <div class="form-actions">
                    <button class="action-btn btn-cancel" onclick="resetPasswordForm()">重置</button>
                    <button class="action-btn btn-save" onclick="changePassword()">保存修改</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 用户编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>编辑用户</h3>
            <input type="hidden" id="editUserId">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="editUsername" readonly>
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="editNickname">
            </div>
            <div class="form-group">
                <label>状态</label>
                <select id="editStatus">
                    <option value="active">活跃</option>
                    <option value="inactive">禁用</option>
                </select>
            </div>
            <div class="form-actions">
                <button class="action-btn btn-cancel" onclick="closeEditModal()">取消</button>
                <button class="action-btn btn-save" onclick="saveUserEdit()">保存</button>
            </div>
        </div>
    </div>

    <script>
        let currentSection = 'users';

        function showSection(section) {
            currentSection = section;
            document.querySelectorAll('.content-card').forEach(card => card.style.display = 'none');
            document.querySelectorAll('.nav-menu a').forEach(link => link.classList.remove('active'));
            document.getElementById(`${section}-section`).style.display = 'block';
            document.querySelector(`[href="#${section}"]`).classList.add('active');
            
            if (section === 'users') loadUsers();
            else if (section === 'messages') loadMessages();
            else if (section === 'permissions') loadUsersForPermissions();
        }

        function loadUsers() {
            fetch('/api/admin/users')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('userTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" class="empty-state"><div class="icon">👤</div><p>暂无用户</p></td></tr>';
                        return;
                    }

                    // 更新统计数据
                    document.getElementById('totalUsers').textContent = data.length;
                    document.getElementById('activeUsers').textContent = data.filter(u => u.status === 'active').length;
                    document.getElementById('pendingUsers').textContent = data.filter(u => u.status === 'pending').length;
                    document.getElementById('disabledUsers').textContent = data.filter(u => u.status === 'inactive').length;

                    data.forEach(user => {
                        const row = document.createElement('tr');
                        const avatarHtml = user.avatar 
                            ? `<img src="${user.avatar}" alt="" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">`
                            : `<div style="width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(135deg, #667eea, #764ba2); color: white; display: flex; align-items: center; justify-content: center; font-weight: 600;">${user.nickname ? user.nickname[0].toUpperCase() : '?'}</div>`;
                        row.innerHTML = `
                            <td>${avatarHtml}</td>
                            <td>${user.id.substring(0, 8)}...</td>
                            <td>${user.username}</td>
                            <td>${user.nickname}</td>
                            <td><span class="status-badge status-${user.status}">${getStatusText(user.status)}</span></td>
                            <td>${formatDate(user.created_at)}</td>
                            <td>
                                <button class="action-btn btn-edit" onclick="openEditModal('${user.id}')">编辑</button>
                                ${user.status === 'pending' ? `<button class="action-btn btn-approve" onclick="toggleUserStatus('${user.id}', 'active')">通过</button>` : ''}
                                <button class="action-btn ${user.status === 'active' ? 'btn-disable' : 'btn-approve'}" onclick="toggleUserStatus('${user.id}', '${user.status === 'active' ? 'inactive' : 'active'}')">
                                    ${user.status === 'active' ? '禁用' : '启用'}
                                </button>
                                <button class="action-btn btn-delete" onclick="deleteUser('${user.id}')">删除</button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    });
                });
        }

        function getStatusText(status) {
            const texts = { active: '活跃', inactive: '禁用', pending: '待审核' };
            return texts[status] || status;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '-';
            const date = new Date(dateStr);
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function openEditModal(userId) {
            fetch(`/api/admin/users/${userId}`)
                .then(response => response.json())
                .then(user => {
                    document.getElementById('editUserId').value = user.id;
                    document.getElementById('editUsername').value = user.username;
                    document.getElementById('editNickname').value = user.nickname;
                    document.getElementById('editStatus').value = user.status;
                    document.getElementById('editModal').classList.add('active');
                });
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        function saveUserEdit() {
            const userId = document.getElementById('editUserId').value;
            const data = {
                nickname: document.getElementById('editNickname').value,
                status: document.getElementById('editStatus').value
            };

            fetch(`/api/admin/users/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(() => {
                closeEditModal();
                loadUsers();
            });
        }

        function toggleUserStatus(userId, status) {
            fetch(`/api/admin/users/${userId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status })
            })
            .then(() => loadUsers());
        }

        function deleteUser(userId) {
            if (confirm('确定要删除这个用户吗？')) {
                fetch(`/api/admin/users/${userId}`, { method: 'DELETE' })
                    .then(() => loadUsers());
            }
        }

        function loadMessages() {
            fetch('/api/admin/messages')
                .then(response => response.json())
                .then(data => {
                    const tbody = document.getElementById('messageTableBody');
                    tbody.innerHTML = '';

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="icon">💬</div><p>暂无消息</p></td></tr>';
                        return;
                    }

                    data.forEach(msg => {
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>${msg.id.substring(0, 8)}...</td>
                            <td>${msg.sender_id.substring(0, 8)}...</td>
                            <td>${msg.receiver_id.substring(0, 8)}...</td>
                            <td>${msg.content || (msg.file_type ? `[${msg.file_type}]` : '')}</td>
                            <td><span class="status-badge ${msg.file_type ? 'status-active' : 'status-pending'}">${msg.file_type || '文字'}</span></td>
                            <td>${formatDate(msg.timestamp)}</td>
                            <td><button class="action-btn btn-delete" onclick="deleteMessage('${msg.id}')">删除</button></td>
                        `;
                        tbody.appendChild(row);
                    });
                });
        }

        function deleteMessage(msgId) {
            if (confirm('确定要删除这条消息吗？')) {
                fetch(`/api/admin/messages/${msgId}`, { method: 'DELETE' })
                    .then(() => loadMessages());
            }
        }

        function loadUsersForPermissions() {
            fetch('/api/admin/users')
                .then(response => response.json())
                .then(users => {
                    const select = document.getElementById('permissionUserSelect');
                    select.innerHTML = '<option value="">请选择用户</option>';
                    users.forEach(user => {
                        const option = document.createElement('option');
                        option.value = user.id;
                        option.textContent = `${user.username} (${user.nickname})`;
                        select.appendChild(option);
                    });
                });
        }

        function savePermissions() {
            const userId = document.getElementById('permissionUserSelect').value;
            if (!userId) {
                alert('请选择用户');
                return;
            }

            const data = {
                chat_enabled: document.getElementById('chatPermission').value === 'enabled',
                upload_enabled: document.getElementById('uploadPermission').value === 'enabled'
            };

            fetch(`/api/admin/users/${userId}/permissions`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => {
                alert('权限设置成功');
                resetPermissionForm();
            });
        }

        function resetPermissionForm() {
            document.getElementById('permissionUserSelect').value = '';
            document.getElementById('chatPermission').value = 'enabled';
            document.getElementById('uploadPermission').value = 'enabled';
        }

        function saveSettings() {
            const data = {
                default_user_status: document.getElementById('defaultUserStatus').value,
                max_file_size: parseInt(document.getElementById('maxFileSize').value),
                allowed_image_types: document.getElementById('allowedImageTypes').value,
                allowed_video_types: document.getElementById('allowedVideoTypes').value
            };

            fetch('/api/admin/settings', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(() => alert('设置保存成功'));
        }

        function resetSettingsForm() {
            document.getElementById('defaultUserStatus').value = 'active';
            document.getElementById('maxFileSize').value = '50';
            document.getElementById('allowedImageTypes').value = 'png,jpg,jpeg,gif,webp';
            document.getElementById('allowedVideoTypes').value = 'mp4,webm,mov';
        }

        function changePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            document.getElementById('passwordError').style.display = 'none';
            document.getElementById('passwordSuccess').style.display = 'none';

            if (!currentPassword || !newPassword || !confirmPassword) {
                document.getElementById('passwordError').textContent = '请填写所有字段';
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            if (newPassword !== confirmPassword) {
                document.getElementById('passwordError').textContent = '两次输入的新密码不一致';
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            if (newPassword.length < 6) {
                document.getElementById('passwordError').textContent = '新密码长度至少为6位';
                document.getElementById('passwordError').style.display = 'block';
                return;
            }

            fetch('/api/admin/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('passwordSuccess').style.display = 'block';
                    resetPasswordForm();
                } else {
                    document.getElementById('passwordError').textContent = data.error || '修改失败';
                    document.getElementById('passwordError').style.display = 'block';
                }
            });
        }

        function resetPasswordForm() {
            document.getElementById('currentPassword').value = '';
            document.getElementById('newPassword').value = '';
            document.getElementById('confirmPassword').value = '';
            document.getElementById('passwordError').style.display = 'none';
            document.getElementById('passwordSuccess').style.display = 'none';
        }

        // 搜索功能
        document.getElementById('userSearch').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            document.querySelectorAll('#userTableBody tr').forEach(row => {
                const username = row.querySelector('td:nth-child(2)').textContent.toLowerCase();
                const nickname = row.querySelector('td:nth-child(3)').textContent.toLowerCase();
                row.style.display = (username.includes(searchTerm) || nickname.includes(searchTerm)) ? '' : 'none';
            });
        });

        // 初始化加载
        loadUsers();
    </script>
</body>
</html>
